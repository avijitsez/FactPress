name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions with twine
        run: twine check dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      # Publishing to PyPI is intentionally gated off until a PYPI_API_TOKEN
      # repository secret has been configured -- the foreman/user flips this
      # `if: false` to `if: true` (or a tag/branch condition) once that
      # secret exists. Until then this step is defined but never runs.
      - name: Publish to PyPI
        if: false  # flip after PYPI_API_TOKEN secret is set
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
