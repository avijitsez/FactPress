[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factpress"
version = "0.2.0"
description = "Facts in, identical prints out — LLM-art-directed, deterministically rendered infographic notifications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "resvg-py==0.3.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
html = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.4", "build>=1.2", "twine>=5"]

[project.scripts]
factpress = "factpress.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["factpress"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "factpress/_builtin/templates"
"brandkits" = "factpress/_builtin/brandkits"

[tool.hatch.build.targets.sdist]
include = [
    "factpress/**",
    "templates/**",
    "brandkits/**",
    "tests/**",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "FACTPRESS_DESIGN.md",
]
