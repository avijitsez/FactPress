[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factpress"
version = "0.1.0.dev0"
description = "Facts in, identical prints out — LLM-art-directed, deterministically rendered infographic notifications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "resvg-py==0.3.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
html = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
factpress = "factpress.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["factpress"]
